<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block titulo %}Salidas Educativas{% endblock %} — {{ escuela_nombre }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_v(escuela_logo) }}">
    <link rel="stylesheet" href="{{ static_v('global.css') }}">
    <link rel="stylesheet" href="{{ static_v('gestion.css') }}">
    {% block estilos %}{% endblock %}
</head>
<body>
    <div class="g-bg">
        <header class="g-header">
            <div class="g-container g-header-flex">
                <div class="marca g-brand">
                    <img src="{{ static_v(escuela_logo) }}" alt="Escudo" class="marca-escudo">
                    <div class="g-titles">
                        <h1>{{ escuela_nombre }} <span class="g-serial">{{ escuela_version }}</span></h1>
                        <p>Salidas Educativas</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="g-container g-shell">
            <main class="g-main" style="width: 100%;">
                {% block contenido %}{% endblock %}
            </main>
        </div>

        <footer class="g-footer">
            <p>{{ escuela_nombre }}</p>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
