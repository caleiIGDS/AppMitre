<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolución 3871/24 — Salidas Educativas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .header {
      background: #1A365D;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #FF6B00;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #e05f00; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="text"] {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 200px;
    }
    .page-info {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .back-link {
      color: white;
      text-decoration: none;
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      display: inline-block;
    }
    .back-link:hover { background: rgba(255,255,255,0.1); }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    #pdf-container {
      display: flex;
      justify-content: center;
      background: #e0e0e0;
      min-height: 600px;
      padding: 20px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .highlight {
      position: absolute;
      background: rgba(255, 255, 0, 0.3);
      border: 2px solid #FFD700;
      box-shadow: 0 0 4px rgba(255, 215, 0, 0.5);
    }
    .message {
      padding: 16px 20px;
      background: #f9f9f9;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #666;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>Resolución RESOC-2024-3871-GDEBA-DGCYE</h1>
    <p style="font-size: 12px; opacity: 0.8; margin-top: 4px;">Salidas Educativas y de Representación Institucional</p>
  </div>
  <div class="controls">
    <button id="prev-btn" onclick="prevPage()">‹ Anterior</button>
    <span class="page-info"><span id="page-num">1</span> / <span id="total-pages">44</span></span>
    <button id="next-btn" onclick="nextPage()">Siguiente ›</button>
    <a href="{{ url_for('static', filename='salidas/resolucion-3871-24.pdf') }}" class="back-link" target="_blank">📄 PDF completo</a>
    <a href="{{ url_for('salidas.nueva') }}" class="back-link">← Volver al formulario</a>
  </div>
</div>

<div class="container">
  <div id="pdf-container">
    <div class="loading">Cargando PDF...</div>
  </div>
  <div class="message" id="message-box"></div>
</div>

<script src="{{ url_for('static', filename='vendor/pdfjs/pdf.mjs') }}" type="module"></script>
<script type="module">
import * as pdfjsLib from "{{ url_for('static', filename='vendor/pdfjs/pdf.mjs') }}";

pdfjsLib.GlobalWorkerOptions.workerSrc = "{{ url_for('static', filename='vendor/pdfjs/pdf.worker.mjs') }}";

const urlParams = new URLSearchParams(window.location.search);
const initialPage = parseInt(urlParams.get('pagina') || '1', 10);
const searchTerm = urlParams.get('buscar') || '';

let pdfDoc = null;
let currentPage = initialPage;

async function loadPDF() {
  pdfDoc = await pdfjsLib.getDocument("{{ url_for('static', filename='salidas/resolucion-3871-24.pdf') }}").promise;
  document.getElementById('total-pages').textContent = pdfDoc.numPages;
  await renderPage(currentPage);
}

async function renderPage(pageNum) {
  if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages) return;

  currentPage = pageNum;
  document.getElementById('page-num').textContent = pageNum;
  document.getElementById('prev-btn').disabled = pageNum === 1;
  document.getElementById('next-btn').disabled = pageNum === pdfDoc.numPages;

  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.5 });

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  await page.render({
    canvasContext: ctx,
    viewport: viewport
  }).promise;

  // Limpiar container y renderizar canvas
  const container = document.getElementById('pdf-container');
  container.innerHTML = '';
  container.appendChild(canvas);

  // Resaltar búsqueda
  if (searchTerm) {
    const textContent = await page.getTextContent();
    highlightText(canvas, ctx, textContent.items, searchTerm, viewport);
  }

  // Mostrar mensaje
  const msgBox = document.getElementById('message-box');
  if (searchTerm) {
    msgBox.innerHTML = `Buscando: "<strong>${searchTerm}</strong>" en la página ${pageNum}`;
  } else {
    msgBox.textContent = `Página ${pageNum} de ${pdfDoc.numPages}`;
  }
}

function highlightText(canvas, ctx, textItems, term, viewport) {
  const searchLower = term.toLowerCase();
  const scale = viewport.scale;

  textItems.forEach((item, i) => {
    if (item.str.toLowerCase().includes(searchLower)) {
      const [x, y, width, height] = item.transform;
      // Coordenadas en el PDF se convierten a coordenadas de canvas
      const canvasX = item.transform[4] * scale;
      const canvasY = (viewport.height - item.transform[5] * scale - item.height * scale);
      const canvasW = item.width * scale;
      const canvasH = item.height * scale;

      // Dibujar rectángulo semitransparente amarillo
      ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
      ctx.fillRect(canvasX, canvasY, canvasW, canvasH);
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 2;
      ctx.strokeRect(canvasX, canvasY, canvasW, canvasH);
    }
  });
}

function prevPage() {
  if (currentPage > 1) {
    renderPage(currentPage - 1);
  }
}

function nextPage() {
  if (pdfDoc && currentPage < pdfDoc.numPages) {
    renderPage(currentPage + 1);
  }
}

// Teclado
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
});

loadPDF();
</script>

</body>
</html>
