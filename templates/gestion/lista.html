{# Listado genérico (templates/crud/lista.html) + lo único propio de gestión: el botón de
   retiro al carrito en cada fila de recursos. #}
{% extends 'crud/lista.html' %}

{% block acciones_fila %}
{% if slug == 'recursos' %}
<span class="g-retiro-widget" data-recurso="{{ fila['id'] }}"
      data-stock="{{ fila['cantidad'] or '' }}" data-cant="{{ carrito.get(fila['id'], 0) }}">
    <form method="post" class="g-inline-form g-retiro-form" data-add-carrito
          action="{{ url_for('gestion.carrito_agregar') }}">
        <input type="hidden" name="recurso_id" value="{{ fila['id'] }}">
        <input type="hidden" name="volver" value="{{ request.full_path }}">
        <button type="submit" class="g-btn g-btn-mini g-retiro-btn">RETIRAR</button>
    </form>
    <span class="g-stepper" hidden>
        <button type="button" class="g-step g-step-menos" aria-label="Quitar uno">−</button>
        <span class="g-step-cant">1</span>
        <button type="button" class="g-step g-step-mas" aria-label="Agregar uno">+</button>
    </span>
</span>
{% endif %}
{% endblock %}
