<div id="agente-widget" class="agente-widget" hidden>
  <div class="agente-widget-header">
    <div class="agente-widget-title">
      <span class="agente-title-dot" aria-hidden="true"></span>
      <span>Asistente</span>
    </div>
    <div class="agente-widget-actions">
      <a href="{{ url_for('agente.chat_page') }}" class="agente-expand-btn" title="Abrir en pantalla completa" aria-label="Abrir en pantalla completa">⤢</a>
      <button id="agente-reset-btn" class="agente-reset-btn" title="Reiniciar chat" aria-label="Reiniciar chat">↺</button>
      <button id="agente-close-btn" class="agente-close-btn" title="Cerrar widget" aria-label="Cerrar">✕</button>
    </div>
  </div>

  {% include 'agente/_agente_chat_core.html' %}
</div>
