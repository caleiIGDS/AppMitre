{% extends 'historia/base.html' %}
{% block titulo %}Acceso{% endblock %}
{% block contenido %}
<div class="g-toolbar">
    <h2>ACCESO RESTRINGIDO</h2>
</div>

{% if error %}<div class="g-error">{{ error }}</div>{% endif %}

<form method="post" class="g-form" action="{{ url_for('historia.login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="g-field">
        <label for="campo-clave">CONTRASEÑA</label>
        <input id="campo-clave" type="password" name="clave" required autofocus>
        <span class="g-help">Módulo en desarrollo — acceso solo con contraseña.</span>
    </div>
    <div class="g-form-actions">
        <button type="submit" class="g-btn">ENTRAR</button>
    </div>
</form>
{% endblock %}
