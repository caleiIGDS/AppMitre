<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Horarios{% endblock %} — {{ escuela_nombre }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    {# Reusa la paleta y las clases g-* de gestión: crud/login.html y crud/403.html las usan. #}
    <link rel="stylesheet" href="{{ url_for('static', filename='marca.css') }}?v=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='gestion.css') }}?v=37">
</head>
<body>
    <div class="g-bg">
        <header class="g-header">
            <div class="g-container g-header-flex">
                <div class="marca g-brand">
                    <img src="{{ url_for('static', filename=escuela_logo) }}" alt="Escudo" class="marca-escudo">
                    <div class="g-titles">
                        <h1>{{ escuela_nombre }} <span class="g-serial">{{ escuela_version }}</span></h1>
                        <p>Sistema de Horarios</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="g-container g-shell">
            <main class="g-main">
                {% block contenido %}{% endblock %}
            </main>
        </div>

        <footer class="g-footer">
            <p>Programa hecho por Calei | <a href="https://github.com/caleiIGDS/AppMitre" target="_blank">Repositorio en GitHub</a></p>
        </footer>
    </div>
</body>
</html>
