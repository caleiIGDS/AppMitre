<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario PDF</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
            -webkit-print-color-adjust: exact;
        }
        h1 {
            text-align: center;
            color: #000;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 10pt;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #eee;
            font-weight: bold;
        }
        .header-info {
            text-align: center;
            margin-bottom: 10px;
        }
        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 8pt;
            color: #666;
        }
        @page {
            size: A4 landscape;
            margin: 1.5cm;
        }
    </style>
</head>
<body>
    <h1>Horario</h1>
    <div class="header-info">
        <h2>{{ tipo.capitalize() }}: {{ valor }}</h2>
    </div>
    <table>
        <thead>
            <tr>
                <th>Día</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Materia</th>
                <th>Profesor</th>
                <th>Aula</th>
                <th>Grupo</th>
            </tr>
        </thead>
        <tbody>
            {% for fila in filas %}
            <tr>
                <td>{{ fila[11] }}</td>
                <td>{{ fila[12] }}</td>
                <td>{{ fila[13] }}</td>
                <td>{{ fila[3] }}</td>
                <td>{{ fila[5] }}</td>
                <td>{{ fila[9] }}</td>
                <td>{{ fila[14] or '-' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="footer">
        Generado por Sistema de Horarios - Página <span class="page-number"></span> de <span class="total-pages"></span>
    </div>
</body>
</html>
