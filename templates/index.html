<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff;
            --secondary: #0056b3; /* Darker blue */
            --tertiary: #e0f2f7; /* Light blue background */
            --white: #ffffff;
            --light-gray: #f4f7f6;
            --dark-gray: #333;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --border-radius: 10px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: var(--tertiary);
            color: var(--dark-gray);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        header {
            background-color: var(--white);
            padding: 15px 0;
            text-align: center;
            box-shadow: var(--shadow);
            border-bottom: 3px solid var(--primary);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            height: 70px;
            width: auto;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
            color: var(--secondary);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .panoramic-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            filter: brightness(0.8);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 0;
        }

        .tab-btn {
            padding: 14px 28px;
            cursor: pointer;
            border: none;
            background: var(--light-gray);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            font-weight: 600;
            color: var(--secondary);
            transition: all 0.3s ease;
            font-size: 1.05em;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }

        .tab-btn:hover {
            background: #d0e7f7;
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 -4px 8px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        .contenedor-busqueda {
            background: var(--white);
            padding: 30px;
            border-radius: 0 var(--border-radius) var(--border-radius) var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-top: 4px solid var(--primary);
        }

        .seccion-busqueda {
            display: none;
        }

        .seccion-busqueda.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--secondary);
            font-size: 1.1em;
        }

        select {
            padding: 12px 15px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #a8d6f5;
            border-radius: 8px;
            background-color: var(--light-gray);
            font-size: 1em;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.08);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007bff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13.2-5.4H18.4c-6.5%200-13.2%202.6-17.6%207.6-4.4%205-4.4%2013.2%200%2018.2l128.6%20127.9c4.4%205%2011.1%207.6%2017.6%207.6s13.2-2.6%2017.6-7.6L287%2087.9c4.4-5%204.4-13.2%200-18.5z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 14px auto;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1), 0 0 0 3px rgba(0, 123, 255, 0.25);
            outline: none;
        }

        /* Calendario Visual */
        .calendario-grid {
            display: grid;
            grid-template-columns: 100px repeat(5, 1fr);
            gap: 2px;
            background-color: #a8d6f5;
            border: 1px solid var(--primary);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .cabecera-dia {
            background: var(--primary);
            color: var(--white);
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
            font-size: 1em;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
        }
        .cabecera-dia:last-child {
            border-right: none;
        }

        .celda {
            background: var(--white);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 3px;
            box-sizing: border-box;
            border-right: 1px solid #e0f2f7;
            border-bottom: 1px solid #e0f2f7;
        }
        .celda:last-child {
            border-right: none;
        }
        .calendario-grid > div:nth-last-child(-n+5) {
            border-bottom: none;
        }

        .hora-eje {
            background: #e9f5fd;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #a8d6f5;
            color: var(--secondary);
            font-size: 1.0em;
        }

        /* Materia Block */
        .materia-bloque {
            flex: 1;
            display: grid;
            grid-template-columns: 45px 1fr;
            border: 1px solid #b3d9ff;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            margin: 2px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .materia-bloque:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .aula-box {
            background: var(--primary);
            color: var(--white);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border-right: 1px solid var(--secondary);
            text-shadow: 0 1px 1px rgba(0,0,0,0.1);
            padding: 5px;
        }

        .info-box {
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            background-color: #e9f5fd;
        }

        .materia-nombre {
            font-weight: 600;
            color: var(--secondary);
            font-size: 1em;
            line-height: 1.3;
            margin-bottom: 2px;
        }

        .profe-nombre {
            font-size: 0.85em;
            color: #57606f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Detailed Table */
        .tabla-scroll {
            overflow-x: auto;
            margin-top: 40px;
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
        }

        h3 {
            color: var(--primary);
            font-size: 1.8em;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0f2f7;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        th, td {
            border: 1px solid #e0f2f7;
            padding: 14px 18px;
            text-align: left;
        }

        th {
            background: var(--secondary);
            color: var(--white);
            font-weight: 600;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background-color: #f8fcfd;
        }

        tr:hover {
            background-color: #eef7fc;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 10px;
            }

            h1 {
                font-size: 2em;
            }

            .panoramic-image {
                height: 180px;
                margin-bottom: 20px;
            }

            .tabs {
                flex-direction: column;
            }

            .tab-btn {
                border-radius: var(--border-radius);
                width: 100%;
            }

            .contenedor-busqueda {
                border-radius: var(--border-radius);
            }

            .calendario-grid {
                grid-template-columns: 80px repeat(auto-fit, minmax(100px, 1fr));
            }

            th, td {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            .logo {
                height: 50px;
            }

            .panoramic-image {
                height: 150px;
            }

            .container {
                padding: 0 10px;
            }

            .tab-btn {
                font-size: 0.9em;
                padding: 12px 15px;
            }

            select {
                font-size: 0.9em;
                padding: 10px;
            }

            .calendario-grid {
                grid-template-columns: 60px repeat(auto-fit, minmax(80px, 1fr));
            }

            .cabecera-dia {
                font-size: 0.8em;
                padding: 10px 5px;
            }

            .hora-eje {
                font-size: 0.9em;
            }

            .materia-nombre {
                font-size: 0.9em;
            }

            .profe-nombre {
                font-size: 0.75em;
            }

            .aula-box {
                font-size: 0.8em;
            }

            .tabla-scroll {
                padding: 15px;
            }

            th, td {
                font-size: 0.8em;
                padding: 8px 10px;
            }
        }
    </style>

</head>
<body>
    <header>
        <div class="header-content">
            <img src="{{ url_for('static', filename='images/logoMitre.jpg') }}" alt="Logo Escuela" class="logo">
            <h1>Sistema de Horarios</h1>
        </div>
    </header>
    <img src="{{ url_for('static', filename='images/mitrepanoramica.jpg') }}" alt="Foto Escuela" class="panoramic-image">

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab(event, 'tab-profesor')">Profesor</button>
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-aula')">Aula</button>
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-curso')">Curso</button>
        </div>

        <div class="contenedor-busqueda">
            <div id="tab-profesor" class="seccion-busqueda active">
                <label>Seleccione Profesor:</label><br>
                <select onchange="buscarEnServidor('profesor', this.value)">
                    <option value="">-- Lista de Profesores --</option>
                    {% for p in datos.profesor %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
                </select>
            </div>

            <div id="tab-aula" class="seccion-busqueda">
                <label>Seleccione Aula:</label><br>
                <select onchange="buscarEnServidor('aula', this.value)">
                    <option value="">-- Lista de Aulas --</option>
                    {% for a in datos.aula %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
                </select>
            </div>

            <div id="tab-curso" class="seccion-busqueda">
                <label>Seleccione Curso:</label><br>
                <select onchange="buscarEnServidor('curso', this.value)">
                    <option value="">-- Lista de Cursos --</option>
                    {% for c in datos.curso %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div id="contenedor-calendario"></div>
        <div class="tabla-scroll" id="contenedor-lista"></div>
    </div>


    <script>
        function cambiarTab(evt, idTab) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("seccion-busqueda");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(idTab).style.display = "block";
            evt.currentTarget.className += " active";
            
            // Limpiar resultados al cambiar
            document.getElementById('contenedor-calendario').innerHTML = "";
            document.getElementById('contenedor-lista').innerHTML = "";
        }

        function buscarEnServidor(modo, valor) {
            if (!valor) return;
            fetch(`/api/${modo}/${valor}`)
                .then(res => res.json())
                .then(filas => {
                    generarCalendario(filas, modo);
                    generarTablaDetallada(filas);
                })
                .catch(err => console.error("Error al obtener datos:", err));
        }

        function generarCalendario(filas, modo) {
            const contenedor = document.getElementById('contenedor-calendario');
            const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
            
            let horasSet = new Set();
            filas.forEach(f => { if(f[12]) horasSet.add(f[12]) });
            let horasOrdenadas = Array.from(horasSet).sort();

            if (horasOrdenadas.length === 0) {
                contenedor.innerHTML = "<p>No hay horarios registrados para esta selección.</p>";
                return;
            }

            let html = '<div class="calendario-grid">';
            html += '<div class="cabecera-dia">HORA</div>';
            dias.forEach(d => html += `<div class="cabecera-dia">${d.toUpperCase()}</div>`);

            horasOrdenadas.forEach(hora => {
                html += `<div class="celda hora-eje">${hora}</div>`;
                dias.forEach(dia => {
                    const clases = filas.filter(f => f[11] === dia && f[12] === hora);
                    html += '<div class="celda">';
                    clases.forEach(clase => {
                        html += `
                            <div class="materia-bloque">
                                 ${
                                    modo === 'aula'
                                        ? `<div class="aula-box">${clase[0]}° ${clase[1]}</div>`
                                        : `<div class="aula-box">Aula: ${clase[9] || '-'}</div>`
                                 }
                                
                                <div class="info-box">
                                    <div class="materia-nombre">${clase[3]}</div>
                                    ${
                                        modo === 'profesor'
                                        ? `<div class="curso-nombre">Curso: ${clase[0]}° ${clase[1]}</div>`
                                        : `<div class="profe-nombre">${clase[5] || ''}</div>`
                                    }

                                </div>
                            </div>`;
                    });
                    html += '</div>';
                });
            });
            html += '</div>';
            contenedor.innerHTML = html;
        }

        function generarTablaDetallada(filas) {
            const contenedor = document.getElementById('contenedor-lista');
            if (filas.length === 0) return;

            let html = `<h3>Detalle de Clases</h3><table>
                <thead>
                    <tr><th>Día</th><th>Inicio</th><th>Fin</th><th>Materia</th><th>Profesor</th><th>Aula</th><th>Grupo</th></tr>
                </thead><tbody>`;
            filas.forEach(f => {
                html += `<tr>
                    <td>${f[11]}</td><td>${f[12]}</td><td>${f[13]}</td>
                    <td><b>${f[3]}</b></td><td>${f[5]}</td><td>${f[9]}</td><td>${f[14] || '-'}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
