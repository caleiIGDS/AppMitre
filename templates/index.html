<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="blueprint-bg">
        <header class="tech-header">
            <div class="tech-container header-flex">
                <div class="header-blueprint">
                    <img src="{{ url_for('static', filename='images/logoMitre.jpg') }}" alt="Escudo" class="tech-logo">
                    <div class="tech-titles">
                        <h1>EMILIO MITRE <span class="serial">V1.16</span></h1>
                        <p class="institution">Sistema de Horarios</p>
                    </div>
                </div>
                <button id="btn-actualizar" class="tech-btn-update" onclick="actualizarDatos()">ACTUALIZAR HORARIOS</button>
            </div>
        </header>

        <div class="tech-container">
            <nav class="tech-tags">
                <button class="tech-tag" onclick="cambiarTab(event, 'tab-curso')">CURSOS</button>
                <button class="tech-tag" onclick="cambiarTab(event, 'tab-profesor')">PROFESORES</button>
                <button class="tech-tag" onclick="cambiarTab(event, 'tab-aula')">AULAS</button>
                <button class="tech-tag" onclick="cambiarTab(event, 'tab-horario_preceptor')">PRECEPTORES</button>
                <button class="tech-tag active" onclick="cambiarTab(event, 'tab-envivo')">TIEMPO REAL</button>
            </nav>

            <section class="tech-search-module">
                <div id="tab-horario_preceptor" class="seccion-busqueda">
                    <div class="tech-field">
                        <input type="text" class="tech-input" placeholder="INGRESE PRECEPTOR..." oninput="filtrarOpciones(this, 'horario_preceptor')" onfocus="filtrarOpciones(this, 'horario_preceptor')">
                        <div id="dropdown-horario_preceptor" class="tech-dropdown"></div>
                    </div>
                </div>
                <div id="tab-profesor" class="seccion-busqueda">
                    <div class="tech-field-group">
                        <div class="tech-field">
                            <input type="text" class="tech-input" placeholder="INGRESE NOMBRE..." oninput="filtrarOpciones(this, 'profesor')" onfocus="filtrarOpciones(this, 'profesor')">
                            <div id="dropdown-profesor" class="tech-dropdown"></div>
                        </div>
                        <div class="opciones-chips" id="chips-profesor"></div>
                        <div class="slide-panel" id="slide-profesor">
                            <button class="slide-opcion" data-opcion="comparar" onclick="seleccionarOpcionSlide('comparar','profesor')">COMPARAR</button>
                        </div>
                        <button class="btn-slide-trigger" id="trigger-profesor" onclick="toggleSlidePanel('profesor')">‹</button>
                    </div>
                </div>

                <div id="tab-aula" class="seccion-busqueda">
                    <div class="tech-field-group">
                        <div class="tech-field">
                            <input type="text" class="tech-input" placeholder="INGRESE UBICACIÓN..." oninput="filtrarOpciones(this, 'aula')" onfocus="filtrarOpciones(this, 'aula')">
                            <div id="dropdown-aula" class="tech-dropdown"></div>
                        </div>
                        <div class="opciones-chips" id="chips-aula"></div>
                        <div class="slide-panel" id="slide-aula">
                            <button class="slide-opcion" data-opcion="comparar" onclick="seleccionarOpcionSlide('comparar','aula')">COMPARAR</button>
                            <button class="slide-opcion" data-opcion="planilla" onclick="seleccionarOpcionSlide('planilla','aula')">PLANILLA GENERAL</button>
                        </div>
                        <button class="btn-slide-trigger" id="trigger-aula" onclick="toggleSlidePanel('aula')">‹</button>
                    </div>
                    
                    <div id="planilla-controls" class="planilla-controls" style="display: none;">
                        <div class="planilla-section">
                            <span class="planilla-label">DÍA:</span>
                            <div class="planilla-tabs dias">
                                <button class="planilla-tab-btn active" onclick="setDiaPlanilla(this, 'Lunes')">Lu</button>
                                <button class="planilla-tab-btn" onclick="setDiaPlanilla(this, 'Martes')">Ma</button>
                                <button class="planilla-tab-btn" onclick="setDiaPlanilla(this, 'Miércoles')">Mi</button>
                                <button class="planilla-tab-btn" onclick="setDiaPlanilla(this, 'Jueves')">Ju</button>
                                <button class="planilla-tab-btn" onclick="setDiaPlanilla(this, 'Viernes')">Vi</button>
                            </div>
                        </div>
                        <div class="planilla-section">
                            <span class="planilla-label">UBICACIÓN:</span>
                            <div class="planilla-tabs pisos" id="planilla-tabs-pisos">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-curso" class="seccion-busqueda">
                    <div class="tech-field-group">
                        <div class="tech-field">
                            <input type="text" class="tech-input" placeholder="INGRESE GRADO..." oninput="filtrarOpciones(this, 'curso')" onfocus="filtrarOpciones(this, 'curso')">
                            <div id="dropdown-curso" class="tech-dropdown"></div>
                        </div>
                        <div class="opciones-chips" id="chips-curso"></div>
                        <div class="slide-panel" id="slide-curso">
                            <button class="slide-opcion" data-opcion="comparar" onclick="seleccionarOpcionSlide('comparar','curso')">COMPARAR</button>
                        </div>
                        <button class="btn-slide-trigger" id="trigger-curso" onclick="toggleSlidePanel('curso')">‹</button>
                    </div>
                </div>

                <div id="tab-envivo" class="seccion-busqueda active">
                    <div class="tech-live-module">
                        <div class="sys-clock-container">
                            <div class="sys-clock" id="dashboard-clock">00:00:00</div>
                        </div>

                        <div class="sys-inputs" style="margin-left: 20px;">
                            <input type="text" id="dashboard-filter-input" class="tech-input-sm" placeholder="FILTRAR CURSO O PROF..." oninput="renderizarDashboard(lastDashboardData)" style="width: 200px; text-transform: uppercase; height: 35px; border: 1px solid var(--secondary); background: #f3f4f6; color: var(--dark); padding: 0 10px; font-weight: bold;">
                        </div>

                        <div class="menu-global">
                            <div class="slide-panel" id="slide-envivo">
                                <label class="slide-opcion" style="display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;">
                                    <input type="checkbox" id="manual-mode-toggle" onchange="toggleManualMode(this)" style="accent-color:var(--secondary);">
                                    MODO MANUAL
                                </label>
                            </div>
                            <button class="btn-slide-trigger" id="trigger-envivo" onclick="toggleSlidePanel('envivo')">‹</button>
                        </div>
                        <div id="manual-controls" class="sys-controls" style="display: none;">
                            <div class="sys-inputs">
                                <input type="date" id="manual-date-input" class="tech-input-sm" oninput="setManualTime()">
                                <input type="time" id="manual-clock-input" class="tech-input-sm" oninput="setManualTime()">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div id="comparacion-banner" class="modo-comparacion-banner" style="display:none;">
                <div class="comp-banner-left">
                    <span class="comp-banner-label">⚡ MODO COMPARACIÓN</span>
                    <div id="comp-banner-items" class="comp-banner-items"></div>
                </div>
                <button class="btn-salir-comparacion" onclick="desactivarModoComparacion()">✕ SALIR</button>
            </div>

            <div id="workspace-calendar-header" class="workspace-header" style="display: none;">
                <h2 id="calendar-title" class="tech-title-center"></h2>
                <div id="preceptor-info-container" class="preceptor-info-container"></div>
                <button id="export-pdf-btn" class="tech-btn-pdf" onclick="exportarAPDF()">GENERAR PDF</button>
            </div>

            <main class="tech-workspace">
                <div id="contenedor-dashboard" style="display: block;"></div>
                <div id="contenedor-calendario" class="tech-grid-container" style="display: none;"></div>
                <div id="contenedor-lista" class="tech-data-table"></div>
            </main>
        </div>
    </div>

    <div id="modal-detalles" class="modal-detalles">
        <div class="modal-contenido">
            <div class="modal-header">
                <span id="modal-titulo">Detalles</span>
                <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="calendar-tooltip" class="calendar-tooltip"></div>
    
    <footer>
        <p>Hecho por Calei | <a href="https://github.com/caleiIGDS/AppMitre" target="_blank">Repositorio en GitHub</a></p>
    </footer>

    <script>
        window.APP_DATA = {
            rawData: {{ datos | tojson | safe }},
            floorMapping: {{ floor_mapping | tojson | safe }},
        };
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}?v=5"></script>
</body>
</html>
