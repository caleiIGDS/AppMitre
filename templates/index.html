<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4285f4; /* Google Blue */
            --secondary: #1967d2;
            --tertiary: #f8f9fa;
            --white: #ffffff;
            --light-gray: #dadce0;
            --dark-gray: #3c4043;
            --shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
            --border-radius: 8px;
            --grid-line: #e8eaed;
        }

        body {
            font-family: 'Poppins', 'Roboto', Arial, sans-serif;
            margin: 0;
            background-color: var(--white);
            color: var(--dark-gray);
            line-height: 1.5;
        }

        header {
            background-color: var(--white);
            padding: 10px 0;
            border-bottom: 1px solid var(--light-gray);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo {
            height: 40px;
            margin-right: 15px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 400;
            color: #5f6368;
        }

        .panoramic-image {
            display: none; /* Ocultamos para un look más "app" tipo calendar */
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 24px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 8px 24px;
            cursor: pointer;
            border: 1px solid var(--light-gray);
            background: var(--white);
            border-radius: 20px;
            font-weight: 500;
            color: #5f6368;
            transition: all 0.2s;
            font-size: 14px;
        }

        .tab-btn:hover {
            background: #f1f3f4;
        }

        .tab-btn.active {
            background: #e8f0fe;
            color: var(--secondary);
            border-color: transparent;
        }

        .contenedor-busqueda {
            margin-bottom: 24px;
        }

        .seccion-busqueda {
            display: none;
        }

        .seccion-busqueda.active {
            display: block;
        }

        select {
            padding: 10px 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--light-gray);
            border-radius: 4px;
            font-size: 14px;
            color: var(--dark-gray);
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(66,133,244,0.1);
        }

        /* Calendario Visual */
        #contenedor-calendario {
            margin-top: 10px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            overflow: hidden;
            background: var(--white);
        }

        .calendario-grid {
            display: grid;
            grid-template-columns: 60px repeat(5, 1fr);
            position: relative;
        }

        .cabecera-vacia {
            height: 50px;
            background: var(--white);
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--grid-line);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .cabecera-dia {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--grid-line);
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 20;
        }

        .columna-horas {
            border-right: 1px solid var(--grid-line);
            background: var(--white);
            position: relative;
        }

        .hora-label {
            position: absolute;
            right: 8px;
            font-size: 10px;
            color: #70757a;
            transform: translateY(-50%);
        }

        .columna-dia {
            position: relative;
            border-right: 1px solid var(--grid-line);
        }

        .columna-dia:last-child {
            border-right: none;
        }

        .dia-nombre {
            font-size: 11px;
            font-weight: 500;
            color: #70757a;
            text-transform: uppercase;
        }

        .grid-line-horizontal {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--grid-line);
            z-index: 1;
        }

        /* Materia Block */
        .materia-bloque {
            position: absolute;
            left: 4px;
            right: 4px;
            background-color: var(--primary);
            color: white;
            border-radius: 4px;
            font-size: 11px;
            overflow: hidden;
            z-index: 5;
            transition: filter 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; /* Para el layout del aula-box */
            align-items: stretch;
        }

        .materia-bloque:hover {
            filter: brightness(0.9);
            box-shadow: var(--shadow);
            z-index: 20;
        }

        .aula-indicador {
            background-color: rgba(0,0,0,0.15);
            width: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            border-right: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .materia-contenido {
            padding: 4px 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .materia-nombre {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .materia-detalles {
            font-size: 10px;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Superposición */
        .bloque-superposicion {
            position: absolute;
            left: 4px;
            right: 4px;
            background-color: #d93025; /* Rojo Google */
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            z-index: 15;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        .bloque-superposicion:hover {
            filter: brightness(1.1);
        }

        /* Tooltip */
        .calendar-tooltip {
            position: fixed;
            background: var(--white);
            color: var(--dark-gray);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 8px 10px 1px rgba(0,0,0,0.14), 0 3px 14px 2px rgba(0,0,0,0.12), 0 5px 5px -3px rgba(0,0,0,0.2);
            z-index: 1000;
            pointer-events: none;
            display: none;
            width: 220px;
            font-size: 13px;
            border: 1px solid var(--light-gray);
        }

        .tooltip-header {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        .tooltip-item { margin-bottom: 2px; }

        /* Para los grupos A y B */
        .split-A { width: calc(50% - 6px) !important; left: 4px !important; }
        .split-B { width: calc(50% - 6px) !important; left: calc(50% + 2px) !important; }

        /* Tabla detallada */
        .tabla-scroll {
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--light-gray);
            color: #5f6368;
            font-weight: 500;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--grid-line);
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        @media (max-width: 768px) {
            .calendario-grid {
                grid-template-columns: 50px repeat(5, 120px);
                overflow-x: auto;
            }
            #contenedor-calendario {
                overflow-x: auto;
            }
        }
    </style>

</head>
<body>
    <header>
        <div class="header-content">
            <img src="{{ url_for('static', filename='images/logoMitre.jpg') }}" alt="Logo Escuela" class="logo">
            <h1>Sistema de Horarios</h1>
        </div>
    </header>
    <img src="{{ url_for('static', filename='images/mitrepanoramica.jpg') }}" alt="Foto Escuela" class="panoramic-image">

    <div class="container">
        <div class="tabs">
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-profesor')">Profesor</button>
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-aula')">Aula</button>
            <button class="tab-btn active" onclick="cambiarTab(event, 'tab-curso')">Curso</button>
        </div>

        <div class="contenedor-busqueda">
            <div id="tab-profesor" class="seccion-busqueda">
                <label>Seleccione Profesor:</label><br>
                <select onchange="buscarEnServidor('profesor', this.value)">
                    <option value="">-- Lista de Profesores --</option>
                    {% for p in datos.profesor %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
                </select>
            </div>

            <div id="tab-aula" class="seccion-busqueda">
                <label>Seleccione Aula:</label><br>
                <select onchange="buscarEnServidor('aula', this.value)">
                    <option value="">-- Lista de Aulas --</option>
                    {% for a in datos.aula %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
                </select>
            </div>

            <div id="tab-curso" class="seccion-busqueda active">
                <label>Seleccione Curso:</label><br>
                <select onchange="buscarEnServidor('curso', this.value)">
                    <option value="">-- Lista de Cursos --</option>
                    {% for c in datos.curso %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div id="contenedor-calendario"></div>
        <div class="tabla-scroll" id="contenedor-lista"></div>
    </div>

    <div id="calendar-tooltip" class="calendar-tooltip"></div>


    <script>
        function cambiarTab(evt, idTab) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("seccion-busqueda");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(idTab).style.display = "block";
            evt.currentTarget.className += " active";
            
            // Limpiar resultados al cambiar
            document.getElementById('contenedor-calendario').innerHTML = "";
            document.getElementById('contenedor-lista').innerHTML = "";
        }

        function buscarEnServidor(modo, valor) {
            if (!valor) return;
            fetch(`/api/${modo}/${valor}`)
                .then(res => res.json())
                .then(filas => {
                    generarCalendario(filas, modo);
                    generarTablaDetallada(filas);
                })
                .catch(err => console.error("Error al obtener datos:", err));
        }

       function generarCalendario(filas, modo) {
    const contenedor = document.getElementById('contenedor-calendario');
    const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
    const horariosFijos = ["07:40", "09:40", "10:00", "12:00", "13:30", "15:30", "15:50", "17:50", "18:00", "20:00", "20:10", "22:10"];
    
    const HORA_MIN = 7 * 60 + 30; // 07:30
    const HORA_MAX = 22 * 60 + 30; // 22:30
    const ALTURA_TOTAL = 1100;    

    const getPosicionY = (horaStr) => {
        if (!horaStr) return 0;
        const [h, m] = horaStr.split(':').map(Number);
        const minutos = h * 60 + m;
        const porcentaje = (minutos - HORA_MIN) / (HORA_MAX - HORA_MIN);
        return porcentaje * ALTURA_TOTAL;
    };

    const timeToMin = (t) => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
    };

    let html = '<div class="calendario-grid">';

    // --- FILA 1: CABECERAS ---
    html += '<div class="cabecera-vacia"></div>';
    dias.forEach(dia => {
        html += `<div class="cabecera-dia">
                    <div class="dia-nombre">${dia}</div>
                </div>`;
    });

    // --- FILA 2: CONTENIDO (HORAS Y DÍAS) ---
    // Columna de Horas
    html += `<div class="columna-horas" style="height:${ALTURA_TOTAL}px; position:relative;">`;
    horariosFijos.forEach(hora => {
        const top = getPosicionY(hora);
        html += `<div class="hora-label" style="top:${top}px;">${hora}</div>`;
    });
    html += '</div>';

    // Columnas de Días
    dias.forEach(dia => {
        html += `<div class="columna-dia" style="height:${ALTURA_TOTAL}px;">`;
        
        // Líneas de cuadrícula para horarios fijos
        horariosFijos.forEach(hora => {
            const top = getPosicionY(hora);
            html += `<div class="grid-line-horizontal" style="top:${top}px;"></div>`;
        });

        const clasesDelDia = filas.filter(f => f[11] === dia).sort((a,b) => timeToMin(a[12]) - timeToMin(b[12]));
        
        // Detectar superposiciones
        let procesados = new Set();
        
        for (let i = 0; i < clasesDelDia.length; i++) {
            if (procesados.has(i)) continue;
            
            let cluster = [clasesDelDia[i]];
            let clusterIdx = [i];
            let maxFin = timeToMin(clasesDelDia[i][13]);
            
            for (let j = i + 1; j < clasesDelDia.length; j++) {
                let inicioJ = timeToMin(clasesDelDia[j][12]);
                if (inicioJ < maxFin) {
                    cluster.push(clasesDelDia[j]);
                    clusterIdx.push(j);
                    maxFin = Math.max(maxFin, timeToMin(clasesDelDia[j][13]));
                } else {
                    break;
                }
            }
            
            const esSplitAB = cluster.length === 2 && 
                              cluster.some(c => c[14] === 'A') && 
                              cluster.some(c => c[14] === 'B') &&
                              cluster[0][12] === cluster[1][12];

            if (cluster.length > 1 && !esSplitAB) {
                const top = getPosicionY(cluster[0][12]);
                const bottom = getPosicionY(cluster.reduce((max, c) => timeToMin(c[13]) > timeToMin(max[13]) ? c : max)[13]);
                const alto = Math.max(bottom - top, 30);
                const jsonDetalles = encodeURIComponent(JSON.stringify(cluster));
                html += `<div class="bloque-superposicion" style="top: ${top}px; height: ${alto}px;" onclick="verDetalleSuperposicion('${jsonDetalles}')">⚠️ Superposición (${cluster.length})</div>`;
                clusterIdx.forEach(idx => procesados.add(idx));
            } else {
                cluster.forEach(clase => {
                    const inicio = clase[12];
                    const fin = clase[13];
                    const grupo = clase[14] || '';
                    const top = getPosicionY(inicio);
                    const bottom = getPosicionY(fin);
                    const alto = Math.max(bottom - top, 20);
                    let splitClass = "";
                    if (modo !== 'aula' && modo !== 'profesor') {
                        if (grupo === 'A') splitClass = "split-A";
                        if (grupo === 'B') splitClass = "split-B";
                    }
                    html += `
                        <div class="materia-bloque ${splitClass}" style="top: ${top}px; height: ${alto}px;" onmouseover="showTooltip(event, '${clase[3]}', '${clase[5]}', '${clase[9]}', '${inicio} - ${fin}', '${clase[0]} ${clase[1]}')" onmouseout="hideTooltip()">
                            <div class="aula-indicador">${clase[9] || '?'}</div>
                            <div class="materia-contenido">
                                <div class="materia-nombre">${clase[3]}</div>
                                <div class="materia-detalles">${modo === 'aula' ? `${clase[0]} ${clase[1]}` : (clase[5] || '-')}</div>
                            </div>
                        </div>`;
                });
                clusterIdx.forEach(idx => procesados.add(idx));
            }
        }
        html += '</div>';
    });

    html += '</div>';
    contenedor.innerHTML = html;
}

        function verDetalleSuperposicion(json) {
            const clases = JSON.parse(decodeURIComponent(json));
            let msg = "Clases superpuestas:\n\n";
            clases.forEach(c => {
                msg += `• ${c[3]} (${c[12]}-${c[13]})\n  Prof: ${c[5]} | Aula: ${c[9]} | Curso: ${c[0]} ${c[1]}\n\n`;
            });
            alert(msg);
        }

        function showTooltip(e, materia, profe, aula, hora, curso) {
            const tooltip = document.getElementById('calendar-tooltip');
            tooltip.innerHTML = `
                <div class="tooltip-header">${materia}</div>
                <div class="tooltip-item"><b>Curso:</b> ${curso}</div>
                <div class="tooltip-item"><b>Prof:</b> ${profe}</div>
                <div class="tooltip-item"><b>Aula:</b> ${aula}</div>
                <div class="tooltip-item"><b>Horario:</b> ${hora}</div>
            `;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';
        }

        function hideTooltip() {
            document.getElementById('calendar-tooltip').style.display = 'none';
        }

        function generarTablaDetallada(filas) {
            const contenedor = document.getElementById('contenedor-lista');
            if (filas.length === 0) return;

            let html = `<h3>Detalle de Clases</h3><table>
                <thead>
                    <tr><th>Día</th><th>Inicio</th><th>Fin</th><th>Materia</th><th>Profesor</th><th>Aula</th><th>Grupo</th></tr>
                </thead><tbody>`;
            filas.forEach(f => {
                html += `<tr>
                    <td>${f[11]}</td><td>${f[12]}</td><td>${f[13]}</td>
                    <td><b>${f[3]}</b></td><td>${f[5]}</td><td>${f[9]}</td><td>${f[14] || '-'}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
