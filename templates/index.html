<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="{{ url_for('static', filename='images/logoMitre.jpg') }}" alt="Logo Escuela" class="logo">
            <h1>Sistema de Horarios UN CAMBIO</h1>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-profesor')">Profesor</button>
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-aula')">Aula</button>
            <button class="tab-btn active" onclick="cambiarTab(event, 'tab-curso')">Curso</button>
            <button class="tab-btn" onclick="cambiarTab(event, 'tab-envivo')">En Vivo ✈️</button>
        </div>

        <div class="contenedor-busqueda">
            <div id="tab-profesor" class="seccion-busqueda">
                <label>Buscar Profesor:</label>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Escribe para buscar profesor..." oninput="filtrarOpciones(this, 'profesor')" onfocus="filtrarOpciones(this, 'profesor')">
                    <div id="dropdown-profesor" class="custom-dropdown"></div>
                </div>
            </div>

            <div id="tab-aula" class="seccion-busqueda">
                <label>Buscar Aula:</label>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Escribe para buscar aula..." oninput="filtrarOpciones(this, 'aula')" onfocus="filtrarOpciones(this, 'aula')">
                    <div id="dropdown-aula" class="custom-dropdown"></div>
                </div>
            </div>

            <div id="tab-curso" class="seccion-busqueda active">
                <label>Buscar Curso:</label>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Escribe para buscar curso..." oninput="filtrarOpciones(this, 'curso')" onfocus="filtrarOpciones(this, 'curso')">
                    <div id="dropdown-curso" class="custom-dropdown"></div>
                </div>
            </div>

            <div id="tab-envivo" class="seccion-busqueda">
                <div class="dashboard-header-light">
                    <div class="dashboard-controls-light">
                        <div class="clock-display-light" id="dashboard-clock">00:00:00</div>
                        <div class="manual-controls-group">
                            <label class="switch-light">
                                <input type="checkbox" id="manual-clock-toggle" onchange="toggleManualClock()">
                                <span class="slider-light round"></span>
                            </label>
                            <span class="control-label">Modo Manual</span>
                            <div class="manual-inputs">
                                <input type="date" id="manual-date-input" class="date-input-light" oninput="setManualTime()">
                                <input type="time" id="manual-clock-input" class="time-input-light" oninput="setManualTime()">
                            </div>
                        </div>
                    </div>
                    <div class="dashboard-status-light">Estado de Clases Actuales</div>
                </div>
            </div>
        </div>
        <div id="search-title-display" class="search-title-display"></div>
        <button id="export-pdf-btn" style="display: none;" onclick="exportarAPDF()">Exportar a PDF</button>

        <div id="contenedor-dashboard" style="display: none;"></div>
        <div id="contenedor-calendario"></div>
        <div class="tabla-scroll" id="contenedor-lista"></div>
    </div>

    <div id="modal-detalles" class="modal-detalles">
        <div class="modal-contenido">
            <div class="modal-header">
                <span id="modal-titulo">Detalles</span>
                <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="calendar-tooltip" class="calendar-tooltip"></div>

    <script>
        window.APP_DATA = {
            rawData: {{ datos | tojson | safe }},
        };
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
